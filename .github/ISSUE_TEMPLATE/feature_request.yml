name: Migration gap
description: A V1 hook, tool shape, or API call is not converted yet.
labels: ["type:feature"]
body:
  - type: textarea
    id: v1
    attributes:
      label: V1 code
      render: typescript
    validations:
      required: true
  - type: textarea
    id: v2
    attributes:
      label: Closest V2 API
      description: Link the V2 docs page or type that should be the destination.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must the report say and the generated module do?
      placeholder: |
        - [ ] classified as converted
        - [ ] emitted module typechecks
        - [ ] corpus plugin X moves from review to converted
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2, p3]
    validations:
      required: true
