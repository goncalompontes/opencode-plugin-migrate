name: Question
description: Ask about usage, migration decisions, or expected output.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Plugin URL, command, report excerpt, or fixture.
  - type: checkboxes
    id: checks
    attributes:
      label: Before asking
      options:
        - label: I read the README and docs/ARCHITECTURE.md.
          required: true
        - label: I searched existing issues.
          required: true
