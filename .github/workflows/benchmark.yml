name: benchmark
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        id: corpus
        with:
          path: benchmarks/corpus
          key: corpus-${{ hashFiles('benchmarks/manifest.ts') }}
      - uses: actions/cache@v4
        with:
          path: benchmarks/.cache
          key: bench-cache-${{ hashFiles('src/**/*.ts', 'package.json', 'bun.lock') }}
          restore-keys: bench-cache-
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-bench-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun benchmarks/run.ts --fetch --core-only
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- opencode-plugin-migrate-benchmark -->";
            const table = fs.readFileSync("benchmarks/RESULTS.md", "utf8");
            const body = `${marker}\n## Migration benchmark\n\n${table}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
