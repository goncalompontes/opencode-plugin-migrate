name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: node dist/cli.js --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun scripts/pack-smoke.ts

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ["2.2.7", "2.1.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun add -d @opencode/plugin@${{ matrix.plugin }}
      - run: bun scripts/probe.ts

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun benchmarks/run.ts --fetch
      - uses: actions/upload-artifact@v4
        with:
          name: migration-results
          path: |
            benchmarks/RESULTS.md
            benchmarks/.out
