name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.4", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.bun }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx biome check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: node dist/cli.js --help

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-coverage-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/coverage-floor.ts

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-package-${{ matrix.node }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/pack-smoke.ts

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ["2.2.7", "2.1.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun add -d @opencode/plugin@${{ matrix.plugin }}
      - run: bun scripts/probe.ts

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun benchmarks/run.ts --fetch
      - uses: actions/upload-artifact@v4
        with:
          name: migration-results
          path: |
            benchmarks/RESULTS.md
            benchmarks/.out
